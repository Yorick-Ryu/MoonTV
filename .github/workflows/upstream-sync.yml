name: Upstream Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge Stardm0 updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add stardm https://github.com/Stardm0/MoonTV.git
          git fetch stardm main
          set -euo pipefail

          # Keep the two release workflows intentionally removed by this Pages fork.
          # Only resolve modify/delete conflicts where our side still deletes the file.
          if ! git merge --no-commit --no-ff stardm/main; then
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo 'Upstream merge failed before a merge could be started.' >&2
              exit 1
            fi
            for path in .github/workflows/release.yml .github/workflows/version-manager.yml; do
              if [[ "$(git status --porcelain -- "$path")" == "DU $path" ]]; then
                git rm -- "$path"
              fi
            done
            if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              echo 'Upstream has conflicts requiring manual review:' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          fi
          git push origin HEAD:main
